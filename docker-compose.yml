version: '3.8'

services:
  analytics-assistant:
    container_name: analytics_chat_assistant
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - AI_PROVIDER=${AI_PROVIDER:-local}
      - LOCAL_API_URL=${LOCAL_API_URL:-http://host.docker.internal:11434/v1}
      - LOCAL_MODEL=${LOCAL_MODEL:-qwen2.5:7b}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-3-5-sonnet-20241022}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - NEXT_PUBLIC_AI_PROVIDER=${AI_PROVIDER:-local}
    volumes:
      # Mount SQLite dev database for host persistence
      - ./dev.db:/app/dev.db
    extra_hosts:
      # Enables the Docker container to seamlessly talk to Ollama running on the host machine
      - "host.docker.internal:host-gateway"
    restart: always
